<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakria Khan Student Portal</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#065f46;color:white;padding:22px;text-align:center}
main{max-width:1100px;margin:auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px #0001}
input,select,textarea{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #cbd5e1;border-radius:6px}
button{background:#047857;color:white;border:0;border-radius:6px;padding:12px;margin:4px;cursor:pointer}
button:hover{background:#065f46}
nav{display:flex;flex-wrap:wrap;gap:5px}
nav button{flex:1;min-width:100px}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#ecfdf5;padding:15px;border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:10px;text-align:left}
th{background:#065f46;color:white}
.tablewrap{overflow-x:auto}
.danger{background:#b91c1c}
footer{text-align:center;padding:20px}
</style>
</head>

<body>

<header>
<h1>Zakria Khan Student Portal</h1>
<p>University Student Management System</p>
</header>

<main>

<section id="login" class="card">
<h2>Login</h2>
<p>یہ ڈیمو لاگ اِن ہے؛ ابھی حقیقی اکاؤنٹس سے منسلک نہیں۔</p>

<label>Username</label>
<input id="username" placeholder="Username">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="error" style="color:red"></p>

<p>Demo Admin: admin / admin123</p>
<p>Demo Student: student / student123</p>
</section>

<section id="portal" class="hidden">
<div class="card">
<span id="welcome"></span>
<button onclick="logout()" class="danger">Logout</button>
</div>

<nav>
<button onclick="page('Dashboard')">Dashboard</button>
<button onclick="page('Students')">Students</button>
<button onclick="page('Attendance')">Attendance</button>
<button onclick="page('Subjects')">Subjects</button>
<button onclick="page('Assignments')">Assignments</button>
<button onclick="page('Notices')">Notices</button>
<button onclick="page('Teachers')">Teachers</button>
<button onclick="page('Timetable')">Timetable</button>
<button onclick="page('Results')">Results</button>
</nav>

<div id="content"></div>
</section>

</main>

<footer>
<p>Zakria Khan Student Portal — Educational Demo</p>
<p>Not an official University of Buner website.</p>
</footer>

<script>
const STORAGE_KEY = "zakria_portal_demo";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {
students:[{name:"Demo Student",roll:"CS-001",className:"BS Computer Science"}],
attendance:[],
subjects:[{name:"Programming Fundamentals",teacher:"Not assigned"}],
assignments:[],
notices:[{title:"Welcome",detail:"Welcome to the student portal."}],
teachers:[],
timetable:[],
results:[]
};

let user = null;
let currentPage = "Dashboard";

function save(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function login(){
 const u=document.getElementById("username").value.trim();
 const p=document.getElementById("password").value;

 if(u==="admin"&&p==="admin123"){
  user={role:"admin",name:"Administrator"};
 }else if(u==="student"&&p==="student123"){
  user={role:"student",name:"Demo Student",roll:"CS-001"};
 }else{
  document.getElementById("error").textContent="Incorrect login details";
  return;
 }

 document.getElementById("login").classList.add("hidden");
 document.getElementById("portal").classList.remove("hidden");
 document.getElementById("welcome").textContent="Welcome "+user.name+" ("+user.role+")";
 page("Dashboard");
}

function logout(){
 user=null;
 document.getElementById("portal").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("password").value="";
}

function isAdmin(){
 return user && user.role==="admin";
}

function page(name){
 currentPage=name;
 const admin=isAdmin();
 let html="";

 if(name==="Dashboard"){
 html=`<div class="card"><h2>Dashboard</h2>
 <div class="grid">
 <div class="stat">Students<h2>${data.students.length}</h2></div>
 <div class="stat">Attendance Records<h2>${data.attendance.length}</h2></div>
 <div class="stat">Subjects<h2>${data.subjects.length}</h2></div>
 <div class="stat">Assignments<h2>${data.assignments.length}</h2></div>
 <div class="stat">Notices<h2>${data.notices.length}</h2></div>
 <div class="stat">Teachers<h2>${data.teachers.length}</h2></div>
 </div></div>`;
 }

 else if(name==="Students"){
 html=`<div class="card"><h2>Students</h2>
 ${admin?`<input id="sname" placeholder="Student name">
 <input id="sroll" placeholder="Roll number">
 <input id="sclass" placeholder="Class">
 <button onclick="addStudent()">Add Student</button>`:""}
 <div class="tablewrap"><table><tr><th>Name</th><th>Roll</th><th>Class</th></tr>
 ${data.students.filter(s=>admin||s.roll===user.roll).map(s=>
 `<tr><td>${safe(s.name)}</td><td>${safe(s.roll)}</td><td>${safe(s.className)}</td></tr>`
 ).join("")}</table></div></div>`;
 }

 else if(name==="Attendance"){
 html=`<div class="card"><h2>Attendance</h2>
 ${admin?`<label>Student</label><select id="aroll">
 ${data.students.map(s=>`<option value="${safe(s.roll)}">${safe(s.name)} (${safe(s.roll)})</option>`).join("")}
 </select>
 <label>Date</label><input type="date" id="adate" value="${new Date().toLocaleDateString('en-CA')}">
 <select id="astatus"><option>Present</option><option>Absent</option><option>Late</option></select>
 <button onclick="markAttendance()">Save Attendance</button>`:""}
 <div class="tablewrap"><table><tr><th>Name</th><th>Roll</th><th>Date</th><th>Status</th></tr>
 ${data.attendance.filter(a=>admin||a.roll===user.roll).map(a=>
 `<tr><td>${safe(a.name)}</td><td>${safe(a.roll)}</td><td>${safe(a.date)}</td><td>${safe(a.status)}</td></tr>`
 ).join("")}</table></div></div>`;
 }

 else if(name==="Subjects"){
 html=`<div class="card
